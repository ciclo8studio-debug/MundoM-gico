<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace;color:#cfd6dc;user-select:none}

#hud{position:fixed;inset:0;pointer-events:none}

#batfill.low{background:#b3261e}
#ev{position:absolute;right:24px;top:20px;font-size:15px;letter-spacing:3px}
#obj{position:absolute;right:24px;top:46px;font-size:11px;letter-spacing:2px;opacity:.65}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:14px;letter-spacing:2px;opacity:0;text-shadow:0 0 8px #000}

#keys{position:absolute;left:24px;bottom:68px;font-size:11px;opacity:.5;letter-spacing:1px;line-height:1.6}

#overlay h2{font-size:14px;letter-spacing:6px;margin:0 0 30px;color:#8b949b;font-weight:normal}
#overlay p{font-size:13px;line-height:1.8;opacity:.8;margin:4px}

<style>
#keys{display:none}
#ptl{position:absolute;left:24px;top:20px;display:flex;gap:10px;align-items:flex-start}

#bat{left:98px;top:90px;bottom:auto;width:150px;font-size:10px}

#ev{top:172px;font-size:13px}#obj{top:196px}
#slots{position:absolute;left:24px;bottom:24px;display:flex;gap:10px}

.sl.on{border:2px solid #e8e2d0;filter:none}

const grime=(()=>{

    for(let i=0;i<2500;i++){const v=150+Math.random()*100|0;g.fillStyle=`rgba(${v},${v},${v},${Math.random()*.35})`;g.fillRect(Math.random()*S,Math.random()*S,1+Math.random()*3,1+Math.random()*3);}
    for(let i=0;i<14;i++){const x=Math.random()*S,w=2+Math.random()*10,gr=g.createLinearGradient(0,0,0,S);gr.addColorStop(0,'rgba(40,36,30,0)');gr.addColorStop(.3,`rgba(40,36,30,${.12+Math.random()*.22})`);gr.addColorStop(1,'rgba(40,36,30,0)');g.fillStyle=gr;g.fillRect(x,0,w,S);}
    for(let i=0;i<10;i++){const x=Math.random()*S,y=Math.random()*S,r=10+Math.random()*30,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(30,28,24,.3)');gr.addColorStop(1,'rgba(30,28,24,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
  });

function collide(p){
  const r=.45;
  for(const c of colliders){
    const cx=Math.max(c.x-c.hw,Math.min(p.x,c.x+c.hw)),cz=Math.max(c.z-c.hd,Math.min(p.z,c.z+c.hd));
    const dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){if(d2>1e-6){const d=Math.sqrt(d2);p.x+=dx/d*(r-d);p.z+=dz/d*(r-d);}else p.x+=r;}
  }
  p.x=Math.max(-48.5,Math.min(48.5,p.x));p.z=Math.max(-48.5,Math.min(48.5,p.z));
}

  addEventListener('gamepadconnected',()=>setTimeout(()=>{$('hint').innerHTML='<span class="k">X</span>Linterna<br><span class="k">A</span>Recoger<br><span class="k">B</span>Pilas<br><span class="k">↑</span>Botiquín<br><span class="k">→</span>Mapa<br><span class="k">Y</span>Mochila';},0));
}
const pack=document.createElement('div');pack.id='pack';document.body.appendChild(pack);
function addItem(type,x,z){
  const g=new THREE.Group();g.position.set(x,.3,z);
  if(type==='battery'){cyl(.09,.09,.3,10,M(0x1d1d1d,.5,.5),0,0,0,g);cyl(.095,.095,.1,10,M(0xffb020,.4,0,2.2,0xffa010),0,.1,0,g);}
  else if(type==='medkit'){box(.42,.28,.3,M(0xe8e8e4,.6,0),0,0,0,g);const rm=M(0xc41e1e,.5,0,1.6,0xff2020);box(.22,.02,.07,rm,0,.15,0,g,false);box(.07,.02,.22,rm,0,.15,0,g,false);}
  else{box(.44,.04,.32,M(0xd9cfa8,.7,0,1.1,0xd9c890),0,0,0,g);box(.02,.045,.3,M(0x8a7a55,.8,0),0,0,0,g,false);}
  scene.add(g);
  items.push({g,type,got:false,phase:Math.random()*6,label:type==='battery'?'pilas':type==='medkit'?'botiquín':'mapa del parque'});
}
for(const [t,x,z] of [['map',4,37],['battery',-9,33],['battery',-20,22],['battery',30,12],['battery',-36,-22],['medkit',12,26],['medkit',-18,-12],['medkit',34,-22]])addItem(t,x,z);
function nearItem(){for(const it of items){if(!it.got&&camera.position.distanceTo(it.g.position)<2.6)return it;}return null;}
function setCnt(el,n){let c=el.querySelector('.cnt');if(!c){c=document.createElement('span');c.className='cnt';el.appendChild(c);}c.textContent=n>0?'×'+n:'';}
function refreshInv(){
  const s=document.querySelectorAll('#slots .sl');
  s[2].classList.toggle('dis',!inv.map);s[3].classList.toggle('dis',inv.medkit<1);
  setCnt(s[1],inv.battery);setCnt(s[3],inv.medkit);renderPack();
}
function renderPack(){
  const s=`<b>MOCHILA</b><br>Cintas VHS: ${found}/4<br>Pilas: ${inv.battery} <small>[R / B]</small><br>Botiquines: ${inv.medkit} <small>[4 / ↑]</small><br>Mapa: ${inv.map?'sí':'no'}`;
  if(s!==lastPack){pack.innerHTML=s;lastPack=s;}
}
function takeItem(it){
  it.got=true;it.g.visible=false;sfx(520,.1,'triangle',.2,150);rumble(80,.2,.4);
  if(it.type==='battery'){inv.battery++;showMsg('Pilas guardadas en la mochila · usa R / B',3500);}
  else if(it.type==='medkit'){inv.medkit++;showMsg('Botiquín guardado · usa 4 / ↑ para curarte',3500);}
  else{inv.map=true;document.body.classList.add('hasmap');$('mapw').classList.remove('big');showMsg('Mapa del parque recogido · ábrelo con 3 / M',3500);}
  refreshInv();
}
function useBattery(){
  if(inv.battery<1){showMsg('No tienes pilas',2500);return;}
  if(battery>=95){showMsg('La batería aún está casi llena',2500);return;}
  inv.battery--;battery=Math.min(100,battery+40);sfx(300,.15,'square',.1,200);showMsg('Pilas cambiadas (+40% batería)',2500);refreshInv();
}
function useSlot(n){
  if(n===1){if(battery>0){lightOn=!lightOn;sfx(900,.05,'square',.08);}else sfx(200,.1,'square',.05);}
  else if(n===2){packOpen=!packOpen;pack.style.display=packOpen?'block':'none';renderPack();}
  else if(n===3){
    if(!inv.map){showMsg('Aún no tienes el mapa. Búscalo cerca de la entrada.',3000);return;}
    $('mapw').classList.toggle('big');
  }else if(n===4){
    if(inv.medkit<1){showMsg('No tienes botiquines',2500);return;}
    if(hp>=6){showMsg('Ya tienes la salud completa',2500);return;}
    inv.medkit--;hp++;renderHearts();refreshInv();sfx(440,.25,'sine',.2,220);showMsg('Te curaste (+1 ♥)',2500);
  }
}
addEventListener('keydown',e=>{
  if(!isPlaying()||over||modal||e.repeat)return;
  const m={Digit1:()=>useSlot(1),Digit2:()=>useSlot(2),KeyI:()=>useSlot(2),Tab:()=>useSlot(2),Digit3:()=>useSlot(3),KeyM:()=>useSlot(3),Digit4:()=>useSlot(4),KeyR:()=>useBattery()}[e.code];
  if(m){e.preventDefault();e.stopImmediatePropagation();m();}
},true);
const xp=[];
function padExtra(){
  const g=getPad();if(!g)return;
  const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed),h=i=>b(i)&&!xp[i];
  if(isPlaying()&&!over&&!modal){if(h(1))useBattery();if(h(12))useSlot(4);if(h(15))useSlot(3);if(h(3))useSlot(2);}
  for(let i=0;i<g.buttons.length;i++)xp[i]=b(i);
}
function animItems(t,dt){
  for(const s of fogS){s.position.x+=s.userData.sp*dt;if(s.position.x>55)s.position.x=-55;}
  beam.visible=spot.visible;bm.opacity=.07*spot.intensity/SPOT_BASE;
  for(const it of items){if(it.got)continue;it.g.rotation.y=t*1.2+it.phase;it.g.position.y=.3+Math.sin(t*2+it.phase)*.05;}
  if(packOpen)renderPack();
  padExtra();
}
refreshInv();
/* Mando (Gamepad API) */
let padPlay=false;const isPlaying=()=>controls.isLocked||padPlay;
const pad={mx:0,my:0,sprint:false},padPrev=[],DEAD=.18;
function getPad(){const l=navigator.getGamepads?navigator.getGamepads():[];for(const g of l)if(g&&g.connected)return g;return null;}
function rumble(ms,s,w){const g=getPad(),a=g&&g.vibrationActuator;if(a&&a.playEffect)a.playEffect('dual-rumble',{duration:ms,strongMagnitude:s,weakMagnitude:w}).catch(()=>{});}
function startPad(){padPlay=true;overlay.style.display='none';initAudio();if(!started){started=true;showMsg('Es tu turno de noche. Mantén la linterna encendida.',5000);}}
addEventListener('gamepadconnected',()=>{
  $('hint').innerHTML='<span class="k">X</span>Linterna<br><span class="k">A</span>Recoger<br><span class="k">Y</span>Mochila<br><span class="k">Back</span>Mapa';
  showMsg('Mando conectado',2500);
});
const ax=v=>Math.abs(v)<DEAD?0:(v-Math.sign(v)*DEAD)/(1-DEAD);
function padUpdate(dt){
  pad.mx=pad.my=0;pad.sprint=false;
  if(over&&padPlay){padPlay=false;setOverlay('TE ENCONTRÓ','FIN DE LA DEMO',`<p>Recuperaste ${found}/4 cintas.</p><p>No debiste mirar atrás.</p>`,'REINTENTAR');}
  const g=getPad();if(!g){padPrev.length=0;return;}
  const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed),hit=i=>b(i)&&!padPrev[i];
  if(!(isPlaying()&&!over)){
    if(hit(0)||hit(9)){if(over)location.reload();else startPad();}
  }else{
    if(hit(9)){
      if(controls.isLocked)controls.unlock();
      else{padPlay=false;setOverlay('PAUSA','MUNDO MÁGICO','<p>Mando: A / Start para continuar</p>','START PARA CONTINUAR');}
    }else{
      if(modal){if(hit(0))modalKey('KeyE');if(hit(1))modalKey('KeyQ');for(let i=0;i<g.buttons.length;i++)padPrev[i]=b(i);return;}
      const lx=ax(g.axes[0]||0),ly=ax(g.axes[1]||0),rx=ax(g.axes[2]||0),ry=ax(g.axes[3]||0);
      pad.mx=lx;pad.my=-ly;pad.sprint=b(4)||b(10);
      if(rx||ry){
        const e=new THREE.Euler(0,0,0,'YXZ').setFromQuaternion(camera.quaternion);
        e.y-=rx*dt*2.8;e.x=Math.max(-1.45,Math.min(1.45,e.x-ry*dt*2.2));camera.quaternion.setFromEuler(e);
      }
      if(hit(2)){if(battery>0){lightOn=!lightOn;sfx(900,.05,'square',.08);}else sfx(200,.1,'square',.05);}
      if(hit(0)||hit(7))interact();
      if(hit(3))showMsg(`Mochila: cintas ${found}/4 · Batería ${Math.ceil(battery)}%`,3000);
      if(hit(8))$('mapw').classList.toggle('big');
    }
  }
  for(let i=0;i<g.buttons.length;i++)padPrev[i]=b(i);
}
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;padUpdate(dt);
  if(isPlaying()&&!over&&!modal){
    const sprint=keys.ShiftLeft||keys.ShiftRight||pad.sprint,sp=(sprint?6.8:4)*dt;
    let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+pad.mx,dz=(keys.KeyW?1:0)-(keys.KeyS?1:0)+pad.my;const moving=dx||dz;
    if(moving){const l=Math.max(1,Math.hypot(dx,dz));controls.moveRight(dx/l*sp);controls.moveForward(dz/l*sp);bob+=dt*(sprint?12:8);}
    collide(camera.position);camera.position.y=1.45+(moving?Math.sin(bob)*.045:0);
    if(lightOn&&battery>0)battery=Math.max(0,battery-dt*.9);
    if(battery<=0)lightOn=false;
    if(entityActive){
      toE.copy(entity.position).sub(camera.position);toE.y=0;
      const dist=toE.length();camera.getWorldDirection(fwd);fwd.y=0;fwd.normalize();toE.normalize();
      const looking=fwd.angleTo(toE)<.24&&dist<60;
      if(looking){
        gaze+=dt;eyeMat.color.setHex(Math.random()<.2?0xffffff:0xff1a1a);
        if(gaze>3){gaze=0;triggerGlitch();placeEntity(Math.max(5,dist*.6));hurt();}
      }else{
        gaze=Math.max(0,gaze-dt*.5);entity.position.addScaledVector(toE,-.85*dt);eyeMat.color.setHex(0xff1a1a);
      }
      entity.lookAt(camera.position.x,0,camera.position.z);
      beatT-=dt;
      if(beatT<=0){beatT=Math.max(.35,Math.min(1.2,dist/40));sfx(58,.16,'sine',.45,-20);setTimeout(()=>sfx(52,.14,'sine',.35,-15),160);}
      if(dist<2.2){over=true;triggerGlitch();glitchT=2;noiseBurst(1.2,.5);controls.unlock();}
    }
    const n=tryPickup(false),pt=promptText(n);promptEl.textContent=pt;promptEl.style.opacity=pt?1:0;
  }
  const low=battery<15&&lightOn;
  spot.visible=lightOn&&battery>0;
  spot.intensity=SPOT_BASE*(low?(Math.random()<.22?.08:.55+Math.random()*.4):1);
  $('batfill').style.width=battery+'%';$('batfill').classList.toggle('low',battery<15);
  $('battxt').textContent=`BATERÍA ${Math.ceil(battery)}%`;
  for(const n of neons){
    n.off-=dt;if(n.off<=0&&Math.random()<dt*.6)n.off=.05+Math.random()*.35;
    const k=n.off>0?.05:.8+.2*Math.sin(t*n.f+n.p);
    n.l.intensity=n.base*k;n.mats.forEach(m=>m.emissiveIntensity=3*k);
  }
  animItems(t,dt);for(const tp of tapes){if(tp.got)continue;tp.g.rotation.y+=dt;tp.g.position.y=.35+Math.sin(t*2+tp.phase)*.05;tp.l.intensity=2.5+Math.sin(t*3+tp.phase);}
  glitchT=Math.max(0,glitchT-dt);
  glitchPass.uniforms.time.value=t;
  glitchPass.uniforms.amount.value=Math.max(Math.min(1,glitchT/.7),entityActive?gaze/3*.22:0);
  {
    const eu=new THREE.Euler().setFromQuaternion(camera.quaternion,'YXZ');
    girl.position.set(camera.position.x,0,camera.position.z);girl.rotation.y=eu.y;
    const o=new THREE.Vector3(.55,.4,2.6).applyQuaternion(camera.quaternion);
    view.position.copy(camera.position).add(o);view.position.y=Math.max(.5,view.position.y);view.quaternion.copy(camera.quaternion);
    miniAng+=dt*.35;car.position.set(4.6+Math.cos(miniAng)*3.2,.55,.5+Math.sin(miniAng)*3.2);car.rotation.y=-(miniAng+Math.PI/2);
    $('s1').classList.toggle('on',spot.visible);drawMap(eu.y);
  }
  composer.render();
}
animate();
</script>
