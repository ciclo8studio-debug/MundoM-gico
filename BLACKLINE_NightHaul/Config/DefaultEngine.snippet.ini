; ============================================================================
; BLACKLINE: NIGHT HAUL - DefaultEngine.snippet.ini (UE 5.8.4)
; Pegar al final de Config/DefaultEngine.ini del proyecto Blackline.
; Objetivo: 60 FPS (16.6 ms) de noche, PC 8-16 GB RAM, GPU media (clase GTX 1660 / RTX 3050 / RX 6600), 1080p.
; Todo valor marcado "VERIFY-5.8" debe confirmarse con `stat unit`, `stat gpu` y `ListCVars` en 5.8.4.
; ============================================================================

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Blackline/Maps/L_NightRoute.L_NightRoute
EditorStartupMap=/Game/Blackline/Maps/L_NightRoute.L_NightRoute
GlobalDefaultGameMode=/Script/Blackline.BlacklineGameMode

[/Script/Engine.RendererSettings]
; --- GI y reflejos: Lumen, RT por SOFTWARE (SDF). Sin RT por hardware: la GPU media no lo sostiene a 60 FPS.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
r.RayTracing=False
r.SkinCache.CompileShaders=False
; --- Nanite: activo en proyecto, pero SOLO se habilita por malla en estaticos pesados (rocas, muros, escombros, retenes).
r.Nanite.ProjectEnabled=True
; --- Luces dinamicas: MegaLights para faros, baliza, foco de inspeccion y luces de patrullas (muchas luces con sombra).
r.MegaLights.EnableForProject=True
; --- Sombras: Virtual Shadow Maps
r.Shadow.Virtual.Enable=1
; --- Sin Substrate (menos coste de shader en iGPU/GPU media)
r.Substrate=False
; --- Sin Forward Shading (Lumen/VSM lo exigen deferred)
r.ForwardShading=False
; --- Reflejos de cielo / exposicion nocturna
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.AllowStaticLighting=False
r.SupportSkyAtmosphereAffectsHeightFog=True
r.Mobile.AllowDitheredLODTransition=False
r.TemporalAA.Upsampling=1
r.AntiAliasingMethod=4

[SystemSettings]
; =========================== RESOLUCION / UPSCALING ===========================
; TSR (AntiAliasingMethod=4) a 75%: 1080p -> 810p interno. Equilibrio nitidez/coste; a 60 FPS el TSR recupera
; detalle fino de ruedas, malla de reja y texto del tablero. 67% se nota blando en cockpit.
r.AntiAliasingMethod=4
r.ScreenPercentage=75
r.TSR.History.ScreenPercentage=100
; Calidad de actualizacion del historial 2 (def. 3): -0.3 ms aprox. con poco ghosting.
r.TSR.History.UpdateQuality=2
r.TSR.ShadingRejection.Flickering=1
r.TSR.Velocity.HoleFill=1
r.Tonemapper.Sharpen=0.3
r.SceneColorFormat=4
r.MotionBlurQuality=2
r.BloomQuality=3
r.LensFlareQuality=0
r.SceneRenderTargetResizeMethod=2
r.Tonemapper.GrainQuantization=1

; =========================== LUMEN (Alto, software RT) ===========================
; "High" sin hardware RT. Se bajan 3 costos caros y se conserva la calidad de rebote nocturno.
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.Lumen.TraceMeshSDFs.Allow=1
; Sondas de pantalla: factor 16 = default (calidad Alta). Octaedro 8 = default.
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
; Filtrado espacial (menos ruido de noche, donde hay poca luz y mas varianza).
r.Lumen.ScreenProbeGather.SpatialFilterNumPasses=3
r.Lumen.ScreenProbeGather.Temporal.MaxFramesAccumulated=10
; AO de corto alcance: da contacto bajo el chasis y la carga.
r.Lumen.ScreenProbeGather.ShortRangeAO=1
; Distancias: la carretera nocturna se ve poco lejos. 12000 cm del SDF global alcanzan; menos memoria y trazo.
r.Lumen.TraceMeshSDFs.TraceDistance=8000
r.Lumen.ScreenProbeGather.MaxRayIntensity=40
r.LumenScene.GlobalSDF.ClipmapExtent=2500
r.LumenScene.SurfaceCache.CardCaptureFactor=1
; Reflejos: solo superficies lisas (asfalto mojado, cabina, parabrisas). Roughness > 0.4 usa la sonda.
r.Lumen.Reflections.MaxRoughnessToTrace=0.4
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0.2
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.Temporal.MaxFramesAccumulated=16
r.Lumen.Reflections.RadianceCache=1
; Aprovechar cuadros: Lumen actualiza la escena en un presupuesto fijo (ms) para no picar la GPU.
r.LumenScene.SurfaceCache.Capture.MaxTexelsPerFrame=2048
; Fog en rebotes (5.8: default on). Barato y da el aire "denso" nocturno.
r.Lumen.HeightFog=1

; =========================== NANITE ===========================
; Solo en estaticos pesados. Skeletal (furgoneta, ruedas) y foliage animado NO usan Nanite (en 5.8 VERIFY).
r.Nanite=1
; 1.0 = default. 1.5 reduce triangulos activos ~25% sin diferencia visible a 810p internos.
r.Nanite.MaxPixelsPerEdge=1.5
r.Nanite.MinPixelsPerEdgeHW=32
r.Nanite.Streaming.StreamingPoolSize=256
r.Nanite.ComputeRasterization=1
r.Nanite.AllowTessellation=0
r.Nanite.ProgrammableRaster.AllowMaterial=0
r.Nanite.MaxNodes=1048576
r.Nanite.MaxCandidateClusters=1048576
r.Nanite.MaxVisibleClusters=1048576
r.Nanite.PrimShaderRasterization=1
r.Nanite.MeshShaderRasterization=1

; =========================== VIRTUAL SHADOW MAPS (optimizado) ===========================
r.Shadow.Virtual.Enable=1
; Paginas fisicas: 4096 default -> 2048. Ahorra ~64 MB (128x128 x 4B x 2048 = 128 MB; 4096 = 256 MB) sin saturar a 810p.
r.Shadow.Virtual.MaxPhysicalPages=2048
; Resolucion: sol/luna direccional 0.5 mas barata, locales (faros) 1.0 mas barata. Reduce paginas por cuadro.
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5
r.Shadow.Virtual.ResolutionLodBiasLocal=1.0
; Cache estatico/dinamico separado: la ruta no cambia, la furgoneta si. Evita re-renderizar mundo cada cuadro.
r.Shadow.Virtual.Cache=1
r.Shadow.Virtual.Cache.StaticSeparate=1
; Trazado de sombras suaves (SMRT): menos rayos en luces locales (faros / baliza).
r.Shadow.Virtual.SMRT.RayCountLocal=4
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=2
r.Shadow.Virtual.SMRT.RayCountDirectional=6
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=3
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
r.Shadow.Virtual.UseFarShadowCulling=1
r.Shadow.Virtual.MaxPhysicalPages.Dynamic=1
; Rango de luz maximo para sombras VSM: los faros no necesitan > 60 m.
r.Shadow.RadiusThreshold=0.03
r.Shadow.DistanceScale=0.8
r.Shadow.MaxResolution=2048
r.Shadow.MaxCSMResolution=2048

; =========================== MEGALIGHTS (luces dinamicas de retenes/patrullas) ===========================
r.MegaLights.Allowed=1
r.MegaLights.DefaultShadowMethod=1
r.MegaLights.NumSamplesPerPixel=2
r.MegaLights.Temporal=1

; =========================== STREAMING / MEMORIA ===========================
; Pool de texturas: 2560 MB (rango pedido 2048-3072). Con 8 GB RAM y VRAM ~6 GB: deja margen
; para VSM (128 MB), Lumen (~600 MB), Nanite (256 MB). En 16 GB RAM / 8 GB VRAM se puede subir a 3072.
r.Streaming.PoolSize=2560
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.UseFixedPoolSize=0
r.Streaming.MaxEffectiveScreenSize=0
r.Streaming.FullyLoadUsedTextures=0
r.Streaming.MipBias=0
r.Streaming.HLODStrategy=0
r.Streaming.DefragDynamicBounds=1
; Mundo: World Partition con celdas de 128 m, carga a 400 m (carretera nocturna lineal).
wp.Runtime.OverrideRuntimeSpatialHashLoadingRange=400
s.AsyncLoadingThreadEnabled=1
s.AsyncLoadingTimeLimit=4
s.LevelStreamingActorsUpdateTimeLimit=3.0
s.UnregisterComponentsTimeLimit=1.0
gc.TimeBetweenPurgingPendingKillObjects=60
gc.IncrementalGCTimePerFrame=0.002
r.TextureStreaming=1

; =========================== AJUSTES NOCTURNOS ===========================
; Niebla volumetrica: rejilla 16 px (def. 8): 4x menos voxeles. Imprescindible para los conos de faros.
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.VolumetricFog.HistoryMissSupersampleCount=4
r.VolumetricFog.InverseSquaredLightDistanceBiasScale=1.0
r.VolumetricFog.Emissive=0
r.VolumetricFog.TemporalReprojection=1
r.VolumetricFog.DepthDistributionScale=24
r.VolumetricFog.LightFlickerSuppress=1
; Luces locales con niebla: tope de luces por celda.
r.LightMaxDrawDistanceScale=0.8
r.MinScreenRadiusForLights=0.03
r.MinScreenRadiusForDepthPrepass=0.03
r.MinScreenRadiusForCSMDepth=0.01
r.EarlyZPass=2
r.EarlyZPassOnlyMaterialMasking=0
; Exposicion automatica de noche: rango extendido (evita ojo de gato al pasar de cabina oscura a faro).
r.EyeAdaptationQuality=2
r.EyeAdaptation.MethodOverride=1
r.EyeAdaptation.LensAttenuation=0.78
r.DefaultFeature.AutoExposure.Bias=0.5
r.SkyLight.RealTimeReflectionCapture=1
r.SkyLight.RealTimeReflectionCapture.TimeSlice=1
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.FastSkyLUT=1
r.VolumetricCloud=0
r.Water.SingleLayer.Reflection=0
r.SSS.Quality=0
r.ParticleLightQuality=1
; Lluvia / asfalto mojado: reflejo Lumen con solo roughness bajo (ver Lumen arriba).
r.RenderTargetPoolMin=400
r.GPUSkin.Limit4BoneInfluences=1
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=0.85
r.DetailMode=2
r.FinishCurrentFrame=0
r.OneFrameThreadLag=1
; Cinematica / Niagara: presupuesto de particulas (lluvia, polvo, chispas).
fx.Niagara.QualityLevel=2
fx.Niagara.GPUCulling=1
fx.MaxNiagaraGPUParticlesSpawnPerFrame=500000

; =========================== FRAME PACING 60 FPS ===========================
t.MaxFPS=60
r.VSync=1
r.VSyncEditor=0
r.SyncInterval=1
rhi.SyncInterval=1
r.GTSyncType=1
r.Vulkan.EnableDefrag=0
; Dynamic resolution: si baja de 60, escala entre 67% y 83% para no caer (rango alrededor del 75%).
r.DynamicRes.OperationMode=2
r.DynamicRes.MinScreenPercentage=67
r.DynamicRes.MaxScreenPercentage=83
r.DynamicRes.TargetedGPUHeadRoom=10
r.DynamicRes.FrameTimeBudget=16.6
r.DynamicRes.ChangePercentageThreshold=1.0

; =========================== AUDIO (WASAPI es default en 5.8) ===========================
[/Script/Engine.AudioSettings]
QualityLevels=(QualityName="Night",MaxChannels=48)

[Audio]
AudioDeviceModuleName=WASAPI

[/Script/Engine.PhysicsSettings]
; Chaos Vehicles: sub-stepping fijo para estabilidad con 4x4 pesada y carga con centro de masa movil.
bSubstepping=True
bSubsteppingAsync=False
MaxSubstepDeltaTime=0.0166667
MaxSubsteps=6
DefaultGravityZ=-980.0
DefaultTerrainFrictionMode=0

[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False
NearClipPlane=10.0

[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="Interact")
